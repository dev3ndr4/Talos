services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-it}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - sandbox
    networks:
      - talos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - talos-network

  sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    volumes:
      - ./sandbox/workspace:/workspace
    networks:
      - talos-network

networks:
  talos-network:
    driver: bridge
